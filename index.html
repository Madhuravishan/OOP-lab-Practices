        // --- SYNTAX HIGHLIGHTER ---
        function highlightCode(code) {
            if(!code) return '';
            let html = code
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/\b(class|public|private|protected|static|void|int|double|boolean|String|new|try|catch|finally|throw|throws|extends|implements|abstract|interface|return|this|super|if|else|while|for)\b/g, '<span class="token-keyword">$1</span>')
                .replace(/\b(System|out|println|print|Exception|ArithmeticException|Thread|Runnable|Scanner|File|StringBuilder|Math)\b/g, '<span class="token-type">$1</span>')
                .replace(/("[^"]*")/g, '<span class="token-string">$1</span>')
                .replace(/(\/\/.*)/g, '<span class="token-comment">$1</span>')
                .replace(/\b(\d+)\b/g, '<span class="token-number">$1</span>');
            return html;
        }

                            <div class="absolute -left-12 top-0 w-8 h-8 rounded-full bg-brand-500 text-white flex items-center justify-center font-bold text-sm shadow-md ring-4 ring-slate-50 dark:ring-slate-900">4</div>
                            <div class="bg-white dark:bg-slate-800 p-5 rounded-xl border border-slate-200 dark:border-slate-700 shadow-sm">
                                <h3 class="font-bold text-lg mb-1">Follow Method Calls</h3>
                                <p class="text-slate-600 dark:text-slate-400 text-sm">If <code class="text-brand-500">obj.doWork()</code> is called, check if <code class="text-brand-500">doWork</code> is Overridden in the child. If yes, the child's version runs (Runtime Polymorphism).</p>
                            </div>
                        </div>

                        <div class="relative z-10">
                            <div class="absolute -left-12 top-0 w-8 h-8 rounded-full bg-brand-500 text-white flex items-center justify-center font-bold text-sm shadow-md ring-4 ring-slate-50 dark:ring-slate-900">5</div>
                            <div class="bg-white dark:bg-slate-800 p-5 rounded-xl border border-slate-200 dark:border-slate-700 shadow-sm">
                                <h3 class="font-bold text-lg mb-1">Write Output on Paper</h3>
                                <p class="text-slate-600 dark:text-slate-400 text-sm">Every time you see <code class="text-brand-500">System.out.println</code>, write it down. Keep track of variable values changing.</p>
                            </div>
                        </div>
                    </div>
                </div>
            `;
            contentArea.innerHTML = html;
        }

        function renderMustRemember() {
            let html = `
                <div class="max-w-5xl mx-auto animate-fade-in pb-20">
                    <div class="text-center mb-10">
                        <div class="inline-block bg-yellow-100 text-yellow-800 dark:bg-yellow-900/30 dark:text-yellow-500 px-4 py-1.5 rounded-full text-sm font-bold uppercase tracking-wider mb-4"><i class="fa-solid fa-bolt"></i> 5 Minutes Before Exam</div>
                        <h1 class="text-3xl md:text-5xl font-extrabold tracking-tight">Must Remember</h1>
                    </div>
                    
                    <div class="grid md:grid-cols-2 gap-4">
                        ${DB.mustRemember.map(item => `
                            <div class="bg-white dark:bg-slate-800 p-5 rounded-xl border-l-4 border-l-brand-500 shadow-sm flex flex-col justify-center">
                                <h3 class="font-bold text-slate-900 dark:text-white text-lg mb-1 font-mono">${item.title}</h3>
                                <p class="text-slate-600 dark:text-slate-400 text-sm">${item.text}</p>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
            contentArea.innerHTML = html;
        }


        let currentView = 'dashboard';

        function buildNav() {
            const nav = document.getElementById('nav-links');
            let html = '';
            
            DB.navStructure.forEach(item => {
                if (item.type === 'header') {
                    html += `<div class="mt-6 mb-2 px-3 text-xs font-bold text-slate-400 uppercase tracking-widest">${item.label}</div>`;
                } else {
                    const activeClass = currentView === item.id ? 'bg-brand-50 text-brand-600 dark:bg-brand-900/20 dark:text-brand-400 font-bold' : 'text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800 font-medium';
                    html += `
                        <button onclick="switchView('${item.id}')" class="w-full text-left px-3 py-2.5 rounded-lg transition-colors flex items-center gap-3 ${activeClass}">
                            <i class="fa-solid ${item.icon} w-5 text-center ${currentView === item.id ? '' : 'opacity-70'}"></i> 
                            <span class="truncate">${item.label}</span>
                        </button>
                    `;
                }
            });
            nav.innerHTML = html;
        }

        function switchView(viewId, param = null) {
            currentView = viewId;
            buildNav();
            contentArea.scrollTop = 0;
            
            if (window.innerWidth < 768) toggleMenu(false); // Close mobile menu

            if (viewId === 'dashboard') renderDashboard();
            else if (viewId.startsWith('concept_')) renderConcept(viewId);
            else if (viewId === 'code_tracer') {
                if(param) initTracer(param);
                else renderTracerMenu();
            }
            else if (viewId === 'comparisons') renderComparisons();
            else if (viewId === 'common_errors') renderErrors();
            else if (viewId === 'read_code') renderReadCode();
            else if (viewId === 'must_remember') renderMustRemember();
        }

        function toggleTheme() {
            const html = document.documentElement;
            const isDark = html.classList.contains('dark');
            const icon = document.getElementById('theme-icon');
            
            if (isDark) {
                html.classList.remove('dark');
                icon.classList.remove('fa-sun');
                icon.classList.add('fa-moon');
            } else {
                html.classList.add('dark');
                icon.classList.remove('fa-moon');
                icon.classList.add('fa-sun');
            }
        }

        function toggleMenu(forceClose = null) {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('mobile-overlay');
            const isClosed = sidebar.classList.contains('-translate-x-full');
            
            if (forceClose === false || !isClosed) {
                sidebar.classList.add('-translate-x-full');
                overlay.classList.add('hidden');
            } else {
                sidebar.classList.remove('-translate-x-full');
                overlay.classList.remove('hidden');
            }
        }

        function handleSearch() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const resultsDiv = document.getElementById('searchResults');
            
            if (query.length < 2) {
                resultsDiv.classList.add('hidden');
                return;
            }

            let results = [];
            Object.keys(DB.concepts).forEach(key => {
                if (DB.concepts[key].title.toLowerCase().includes(query) || DB.concepts[key].simpleDef.toLowerCase().includes(query)) {
                    results.push({ id: key, title: DB.concepts[key].title, type: 'Concept' });
                }
            });

            if (results.length > 0) {
                resultsDiv.innerHTML = results.map(r => `
                    <div onclick="document.getElementById('searchInput').value=''; document.getElementById('searchResults').classList.add('hidden'); switchView('${r.id}')" class="p-3 hover:bg-slate-100 dark:hover:bg-slate-700 cursor-pointer border-b border-slate-100 dark:border-slate-700 last:border-0">
                        <div class="text-sm font-bold text-slate-800 dark:text-slate-200">${r.title}</div>
                        <div class="text-[10px] text-slate-500 uppercase tracking-wide">${r.type}</div>
                    </div>
                `).join('');
                resultsDiv.classList.remove('hidden');
            } else {
                resultsDiv.innerHTML = '<div class="p-4 text-sm text-slate-500 text-center">No results found</div>';
                resultsDiv.classList.remove('hidden');
            }
        }

        // Close search on click outside
        document.addEventListener('click', (e) => {
            if(!e.target.closest('#searchInput') && !e.target.closest('#searchResults')) {
                document.getElementById('searchResults').classList.add('hidden');
            }
        });

        // Initialize App
        window.onload = () => {
            // Check system preference for theme
            if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
                toggleTheme(); 
            }
            buildNav();
            switchView('dashboard');
        };
    </script>
</body>
</html>
